project:
  type: website
  output-dir: docs
  resources:
    - imagem/*
    - imagens/*
  render:
    - index.qmd
    - Kaldor.qmd
    - pasinetti.qmd
    - leis-kaldor.qmd
    - referencias.qmd

website:
  title: "Kaldor & Pasinetti"
  navbar:
    search: false
    title: false
    left:
      - href: index.qmd
        text: Início
      - href: Kaldor.qmd
        text: Modelo de Kaldor
      - href: pasinetti.qmd
        text: Teorema de Pasinetti
      - href: leis-kaldor.qmd
        text: Leis de Kaldor e Brasil
      - href: referencias.qmd
        text: Referências

format:
  html:
    theme: default
    css: styles.css
    toc: true
    toc-title: "Nesta página"
    toc-depth: 2
    anchor-sections: false
    html-math-method: katex
    smooth-scroll: true
    lang: pt-BR
    grid:
      body-width: 760px
      margin-width: 260px